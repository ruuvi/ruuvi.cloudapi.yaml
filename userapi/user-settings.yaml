post:
  summary: Configure a user setting
  description: Creates or updates a setting for the authenticated user.
  operationId: setUserSetting
  tags:
    - User-Settings
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - value
          additionalProperties: false
          properties:
            name:
              type: string
              description: User setting name.
              maxLength: 320
              pattern: '^(?!.*_lastUpdated$)[a-zA-Z0-9_.-]+$'
            value:
              type: string
              description: User setting value.
              maxLength: 65535
            timestamp:
              type: integer
              format: int64
              description: Optional epoch timestamp for the setting. If missing, it is assumed to be the current time.
        examples:
          basic:
            value:
              name: 'language'
              value: 'en'

  responses:
    '200':
      description: Setting stored or updated successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/Success.yaml'
              - type: object
                properties:
                  data:
                    $ref: '../components/schemas/SettingSetResult.yaml'
          examples:
            updated:
              value:
                result: success
                data:
                  action: 'updated'
            added:
              value:
                result: success
                data:
                  action: 'added'

    '400':
      description: INVALID - Missing or malformed fields.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
          examples:
            invalid:
              value:
                result: 'error'
                error: 'Missing required field: name'
                code: 'ER_INVALID_ARGUMENT'

    '401':
      description: UNAUTHORIZED - Auth token missing or invalid.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
          examples:
            unauthorized:
              value:
                result: 'error'
                error: 'UNAUTHORIZED'
                code: 'ER_UNAUTHORIZED'

    '409':
      description: CONFLICT - Setting with same or newer timestamp already exists.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
          examples:
            conflict:
              value:
                result: 'error'
                error: 'Newer setting already exists'
                code: 'ER_CONFLICT'
                sub_code: 'ER_OLD_ENTRY'

get:
  summary: Get user settings
  description: Returns settings for the authenticated user.
  operationId: getUserSettings
  tags:
    - User-Settings
  security:
    - bearerAuth: []

  responses:
    '200':
      description: User settings fetched successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/Success.yaml'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - settings
                    properties:
                      settings:
                        $ref: '../components/schemas/UserSettingObject.yaml'
          examples:
            basic:
              value:
                result: success
                data:
                  settings:
                    language: 'en'
                    language_lastUpdated: 1732187742
                    dashboardLayout: '{"cards":["temperature","humidity"]}'
                    dashboardLayout_lastUpdated: 1732187742

    '401':
      description: UNAUTHORIZED - Auth token missing or invalid.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
          examples:
            unauthorized:
              value:
                result: 'error'
                error: 'UNAUTHORIZED'
                code: 'ER_UNAUTHORIZED'
