openapi: 3.1.0
info:
  title: Ruuvi Cloud - User API
  description: Ruuvi Cloud user facing API. Everything you need to build your own front-end to Ruuvi Cloud.
  version: 1.0.0
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  contact:
    name: Ruuvi Support
    url: https://ruuvi.com/support
    email: support@ruuvi.com

servers:
  - url: https://network.ruuvi.com
  - url: https://testnet.ruuvi.com

tags:
  - name: Air-Firmware
    description: Ruuvi Air firmware update information
  - name: Alerts
    description: Alert management for sensors
  - name: Register-User
    description: User registration and verification
  - name: Sensor-Settings
    description: Sensor settings management
  - name: Sessions
    description: Authenticated session management
  - name: Push-Notifications
    description: Push notification token management
  - name: Sensors
    description: Sensor data and metadata retrieval
  - name: Share
    description: Sensor sharing and unsharing
  - name: Subscription
    description: User subscription management
  - name: User-Settings
    description: User settings management
  - name: Marketing-Consent
    description: Marketing email consent management
  - name: Account-Deletion
    description: |
      Deleting your Ruuvi account takes three steps:

      1. Request deletion with `POST /request-delete`. You get an email with a link.
      2. Open the link. The Ruuvi Station web page checks the link with `POST /verify-delete/status`,
         shows what will be deleted and asks you to confirm, which calls `POST /verify-delete`.
      3. The page shows the progress with `POST /verify-delete/status` until the cleanup is done.
         This takes from minutes to a few days, depending on how much measurement history your
         sensors have.

      Nothing is deleted before you confirm. Deletion is permanent.

paths:
  /air_firmwareupdate:
    $ref: './air-firmware.yaml'
  /alerts:
    $ref: './alerts.yaml'
  /push-register:
    $ref: './push-register.yaml'
  /register:
    $ref: './register.yaml'
  /request-delete:
    $ref: './request-delete.yaml'
  /sensor-settings:
    $ref: './sensor-settings.yaml'
  /sensors-dense:
    $ref: './sensors-dense.yaml'
  /sessions:
    $ref: './sessions.yaml'
  /sessions/current:
    $ref: './sessions-current.yaml'
  /sessions/{id}:
    $ref: './sessions-id.yaml'
  /share:
    $ref: './share.yaml'
  /subscription:
    $ref: './subscription.yaml'
  /settings:
    $ref: './user-settings.yaml'
  /marketing-consent:
    $ref: './marketing-consent.yaml'
  /unshare:
    $ref: './unshare.yaml'
  /verify:
    $ref: './verify.yaml'
  /verify-delete:
    $ref: './verify-delete.yaml'
  /verify-delete/status:
    $ref: './verify-delete-status.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
