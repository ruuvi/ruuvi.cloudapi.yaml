name: API linting

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run linting
        run: npx -y @redocly/cli@latest lint userapi/openapi.yaml --format=github-actions
