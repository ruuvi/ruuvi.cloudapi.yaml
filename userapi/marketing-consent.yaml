get:
  summary: Get marketing consent
  description: |
    Returns the authenticated user's effective newsletter subscription state
    from Sendy. Sendy is the source of truth.

    `consent` is `true` only when `status` is `subscribed`. Pending confirmation,
    delivery failures, complaints, and missing subscribers all return
    `consent: false` with the corresponding status.
  operationId: getMarketingConsent
  tags: [Marketing-Consent]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Current Sendy consent status
      content:
        application/json:
          schema: &response
            allOf:
              - $ref: '../components/schemas/Success.yaml'
              - type: object
                properties:
                  data:
                    type: object
                    required: [consent, status]
                    properties:
                      consent: { type: boolean }
                      status:
                        type: string
                        description: Effective subscriber state reported by Sendy.
                        enum: [subscribed, unsubscribed, unconfirmed, bounced, soft_bounced, complained, not_found]
          examples:
            subscribed:
              summary: Subscribed user
              value:
                result: success
                data:
                  consent: true
                  status: subscribed
            unconfirmed:
              summary: Waiting for double opt-in confirmation
              value:
                result: success
                data:
                  consent: false
                  status: unconfirmed
    '401':
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '../components/schemas/Error.yaml' }
    '500':
      description: Sendy integration failure
      content:
        application/json:
          schema: { $ref: '../components/schemas/Error.yaml' }
post:
  summary: Update marketing consent
  description: |
    Subscribes or unsubscribes the authenticated user's email address in Sendy,
    then returns the effective status held by Sendy.

    When subscribing to a double opt-in list, the normal result may be
    `unconfirmed`. Set `silent` to `true` only when the client is allowed to
    bypass the confirmation email and complete the subscription immediately.
  operationId: setMarketingConsent
  tags: [Marketing-Consent]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [consent]
          additionalProperties: false
          properties:
            consent:
              type: boolean
              description: Set to true to subscribe or false to unsubscribe.
            silent:
              type: boolean
              default: false
              description: When true, bypass Sendy double opt-in confirmation for subscriptions. Ignored when consent is false.
        examples:
          doubleOptIn:
            summary: Subscribe using the list's normal opt-in behavior
            value:
              consent: true
              silent: false
          silentSubscription:
            summary: Subscribe without double opt-in confirmation
            value:
              consent: true
              silent: true
          unsubscribe:
            summary: Unsubscribe
            value:
              consent: false
  responses:
    '200':
      description: Consent updated in Sendy
      content:
        application/json:
          schema: *response
    '400':
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '../components/schemas/Error.yaml' }
    '401':
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '../components/schemas/Error.yaml' }
    '500':
      description: Sendy integration failure
      content:
        application/json:
          schema: { $ref: '../components/schemas/Error.yaml' }
